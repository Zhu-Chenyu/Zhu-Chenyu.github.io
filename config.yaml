  featured:
    enable: true
    title: "精选项目"
    title_en: "Featured Projects"
    items:

    - title: LeHome 挑战：基于 VLA 的双臂衣物折叠
      title_en: "LeHome Challenge: Bimanual Garment Folding with VLA Policies"
      content: 比较 SmolVLA、xVLA、Lingbot、ACT 与 Diffusion Policy 的衣物折叠策略，最终 SmolVLA 在自行评估中取得最高成功率。
      content_en: "A bimanual garment-folding project comparing SmolVLA, xVLA, Lingbot, ACT, and Diffusion Policy, with SmolVLA achieving the best internal success rate."
      image: /images/projects/fold_clothes/smolvla_shirt.mp4
      featured:
        name: 查看详情
        name_en: "View Details"
        link: /fold_clothes
      badges:
        - "VLA"
        - "Imitation Learning"
        - "Bimanual Manipulation"
        - "Deformable Objects"
      links:
        - icon: fa-regular fa-face-smile
          name: "Hugging Face"
          url: https://huggingface.co/LaundryNauts

    - title: 力顺从交互四旋翼无人机（LiDAR 避障功能）
      title_en: "Force-Compliant Quadrotor with LiDAR Obstacle Avoidance"
      content: 一架可沿施加外力方向移动的四旋翼无人机。通过卡尔曼滤波器仅从位置观测中估计外力，基于 LiDAR 的人工势场在保持预期运动方向的同时防止碰撞。
      content_en: "A quadrotor that moves in the direction of applied external force. A Kalman filter estimates force from position observations alone, while a LiDAR-based potential field prevents collisions while preserving intended motion direction."
      image: /images/projects/drone/2x_demo.MP4
      featured:
        name: 查看详情
        name_en: "View Details"
        link: /drone
      badges:
        - "ROS 2"
        - "C++"
        - "Kalman Filter"
        - "Obstacle Avoidance"
        - "PX4"
      links:
        - icon: fab fa-github
          name: "Github"
          url: https://github.com/Zhu-Chenyu/Interaction-Guided-Aerial-Navigation

    - title: 基于视觉引导的 Franka 机械臂多米诺骨牌摆放
      title_en: "Vision-Guided Domino Placement with Franka Emika Robot"
      content: 基于视觉的机器人操作系统，可在 ROS 2 环境下使用 Franka Emika 机械臂检测多米诺骨牌位置、规划碰撞感知轨迹并自主完成骨牌摆放。
      content_en: "A vision-based robotic manipulation system that detects domino positions, plans collision-aware trajectories, and autonomously places dominoes using a Franka Emika robot arm under ROS 2."
      image: /images/projects/fer_domino/squigle_domino.mp4
      featured:
        name: 查看详情
        name_en: "View Details"
        link: /fer_domino
      badges:
        - "ROS 2"
        - "Python"
        - "Robot Manipulation"
        - "Motion Planning"
        - "Computer Vision"
      links:
        - icon: fab fa-github
          name: "Github"
          url: https://github.com/Zhu-Chenyu/Franka-Domino-Project





  # projects
  projects:
    enable: true
    title: "其他项目"
    title_en: "Other Projects"
    items:

      - title: EKF SLAM：TurtleBot3 实体机器人实现
        title_en: "EKF SLAM on a Real TurtleBot3"
        content: 在真实 TurtleBot3 上运行的扩展卡尔曼滤波器 SLAM 管线，通过 LiDAR 扫描聚类与圆拟合检测圆柱形路标，使用马氏距离进行未知数据关联，位姿误差从里程计的 0.657 m 降至 SLAM 的 0.001 m。
        content_en: "A full EKF SLAM pipeline running on a real TurtleBot3 — cylindrical landmark detection via LiDAR clustering and circle fitting, unknown data association with Mahalanobis distance, reducing pose error from 0.657 m (odometry) to 0.001 m."
        image: /images/projects/slam/8xdemo.MP4
        featured:
          name: 查看详情
          name_en: "View Details"
          link: /slam
        badges:
          - "ROS 2"
          - "C++"
          - "EKF SLAM"
          - "LiDAR"
          - "Localization"
        links:
          - icon: fab fa-github
            name: "Github"
            url: https://github.com/Zhu-Chenyu/slam

      - title: 谁偷了我的笔？—— 视觉引导机械臂抓取
        title_en: "Who Stole My Pen? -- Vision-Guided Robot Pen Grasping"
        content: 机械臂通过图像处理（相机标定、掩模处理、质心检测）检测笔的位置，规划抓取路径，拾取笔并返回初始位置。
        content_en: "A robot arm detects pen position through image processing (camera calibration, mask processing, centroid detection), plans a grasping path, picks up the pen, and returns to initial position."
        image: /images/projects/robot-pen-grasping/pen_grasping.gif
        featured:
          name: 查看详情
          name_en: "View Details"
          link: /grab_pen
        badges:
          - "Python"
          - "Computer Vision"
          - "Path Planning"
          - "Robot Control"
        links:
          - icon: fab fa-github
            name: "Github"
            url: https://github.com/Zhu-Chenyu/Who-stole-my-pen


      - title: 碰撞感知动力学仿真（Box-Jack 系统）
        title_en: "Impact-Aware Dynamics Simulation: SymPy-Based Box-Jack System"
        content: 基于 SymPy 符号推导的混杂动力学仿真器，包含单面接触约束和非弹性碰撞速度修正，通过 Plotly 动画和时间序列分析进行验证。
        content_en: "A hybrid dynamics simulator built with SymPy symbolic derivation, featuring unilateral contact constraints and inelastic impact velocity updates, validated through Plotly animations and time-series analysis."
        image: /images/projects/box_jack_impact/inelastic_impact.mp4
        featured:
          name: 查看详情
          name_en: "View Details"
          link: /box_jack_impact
        badges:
          - "Python"
          - "SymPy"
          - "Dynamics"
          - "Impact Modeling"
          - "Hybrid Systems"
        links:
          - icon: fas fa-external-link-alt
            name: "Colab Notebook"
            url: https://colab.research.google.com/drive/1A_hauOwYlPGEzfWMQ_YFyIN-RMTYe0G8?authuser=2#scrollTo=1mpudsGeVxwh



      - title: 蚂蚁大战蜜蜂（塔防策略游戏）
        title_en: "Ants vs SomeBees (Tower Defense Simulation)"
        content: Python 开发的塔防风格游戏。设计了多种蚂蚁和蜜蜂的行为逻辑，管理游戏状态与图形界面。
        content_en: "A tower-defense style game built in Python. Designed behavior logic for various ants and bees, managing game state and graphical interface."
        image: /images/projects/ants-vs-bees/gameplay.mp4
        featured:
          name: 查看详情
          name_en: "View Details"
          link: /ants_vs_bees
        badges:
          - "Python"
          - "Game Dev"
          - "OOP"
          - "GUI"
        links:
          - icon: fab fa-github
            name: "Github"
            url: https://github.com/Zhu-Chenyu/Ants-vs-Some-Bees


      - title: 机器人手术器械热性能实验研究
        title_en: "Thermal Performance Study of Robotic Surgical Tools"
        content: 使用达芬奇手术系统对超声手术器械热性能进行的实验研究，重点分析不同涂层和材料下的冷却特性。
        content_en: "An experimental study on the thermal performance of ultrasonic surgical instruments using the da Vinci Surgical System, focusing on cooling characteristics under different coatings and materials."
        image: /images/internships/intuitive/cooling_cropped.jpg
        featured:
          name: 查看详情
          name_en: "View Details"
          link: /intuitive
        badges:
          - "Robotics"
          - "Experiment Design"
          - "Data Modeling"
          - "Medical Devices"



      - title: 球囊折叠机构（实用新型专利）
        title_en: "Balloon Folding Mechanism (Utility Model Patent)"
        content: 设计了一种用于冷冻消融导管的新型可折叠球囊机构。利用金属丝和鞘管开发球囊折叠机构，可沿预折痕区域实现可控折叠，提高回缩安全性。该设计已获授权专利 CN220988900U。
        content_en: "Designed a novel foldable balloon mechanism for cryoablation catheters. Developed a balloon folding mechanism using wires and sheaths for controlled folding along pre-creased regions, improving retraction safety. Granted patent CN220988900U."
        image: /images/internships/patent/balloon_retracting.gif
        featured:
          name: 查看详情
          name_en: "View Details"
          link: https://patents.google.com/patent/CN220988900U/en
        badges:
          - "Medical Devices"
          - "Mechanical Design"
          - "Patent"
          - "Biomechatronics"
        links:
          - icon: fas fa-file-alt
            name: "Patent"
            url: https://patents.google.com/patent/CN220988900U/en

      - title: 基于强化学习的基站优化
        title_en: "Reinforcement Learning for Base Station Optimization"
        content: 对比多种强化学习算法(DQN, DDPG, TD3, MADDPG, Greedy, Conservative)，联合优化蜂窝基站网络的吞吐量与能耗。
        content_en: "Comparing multiple reinforcement learning algorithms(DQN, DDPG, TD3, MADDPG, Greedy, Conservative) to jointly optimize throughput and energy consumption for cellular base station networks."
        image: /images/projects/base-station-rl/DRL_slides.gif
        featured:
          name: 查看详情
          name_en: "View Details"
          link: https://github.com/Zhu-Chenyu/DRL-for-base-station-optimization
        badges:
          - "Python"
          - "Reinforcement Learning"
          - "Simulation"
          - "Optimization"
        links:
          - icon: fab fa-github
            name: "Github"
            url: https://github.com/Zhu-Chenyu/DRL-for-base-station-optimization



