      name: 项目
      title: 精选项目
      url: "/#featured"   # this jumps to <section id="featured">
      weight: 1
      params:
        name_en: "Projects"
    - identifier: About
      name: 关于
      title: 关于我
      url: /about
      weight: 2
      params:
        name_en: "About"
    - identifier: github
      name: Github
      title: Github 链接
      url: https://github.com/Zhu-Chenyu
      weight: 2
    - identifier: resume
      name: 简历
      title: 简历链接
      url: /resume
      weight: 2
      params:
        name_en: "Resume"
    - identifier: LinkedIn
      name: LinkedIn
      title: LinkedIn 主页
      url: https://www.linkedin.com/in/chenyu-zhu/
      weight: 2

